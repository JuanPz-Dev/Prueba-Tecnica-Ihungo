stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - cd backend/4-api
    - pip install --no-cache-dir -r requirements.txt
    - pip install --no-cache-dir ruff
  script:
    - ruff check app tests

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd backend/4-api
    - pip install --no-cache-dir -r requirements.txt
    - pip install --no-cache-dir pytest pytest-cov
  script:
    - pytest --cov=app --cov-report=term-missing --cov-fail-under=80

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - cd backend/4-api
    - docker build -t ihungo-api .